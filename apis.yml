name: Reactiv
description: >-
  Reactiv is an AI-forward mobile app platform that empowers Shopify merchants and commerce brands
  to build native iOS and Android apps and downloadable-free App Clips for their store in minutes.
  The platform pairs full native apps with lightweight App Clip experiences (accessible via ads, QR
  codes, and links) to convert mobile traffic into app users, and offers migration from competing
  platforms such as Tapcart. Customers include River Island, Browns, Indigo, EverEve, and Missouri
  Star Quilt Co. Reactiv is a portfolio company of Anthemis. This profile was enriched from the
  company's public website, help center, and trust center; Reactiv publishes no public developer API.
